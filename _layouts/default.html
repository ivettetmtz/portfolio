
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Ivette Trejo home">
        <span class="brand-mark">&lt;it/&gt;</span>
        <span class="brand-name">ivette<span class="brand-dot">.</span>dev</span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#toolbox' | relative_url }}">Toolbox</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
      </nav>

      <a class="nav-contact" href="{{ '/#contact' | relative_url }}">
        Let's connect <span aria-hidden="true">↗</span>
      </a>
    </div>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="{{ '/' | relative_url }}">ivette<span>.</span>dev</a>
    <p>Designed with curiosity. Built with intention.</p>
    <a href="https://github.com/ivettetmtz" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    <p class="copyright">© {{ 'now' | date: '%Y' }} Ivette Trejo</p>
  </footer>
</body>
</html>
